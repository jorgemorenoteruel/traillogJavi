Desacoplamiento % = (EF 1.ª mitad − EF 2.ª mitad) / EF 1.ª mitad · 100`,refs:"Friel J. The Triathlete's Training Bible, 4.ª ed. VeloPress; 2016. Friel J. Aerobic endurance and decoupling. TrainingPeaks."},React.createElement("p",null,"Si la FC sube mientras la potencia se mantiene, la relación se «desacopla». Por debajo del 5 % la sesión aeróbica está bien sostenida. El valor principal excluye los 10 primeros minutos, porque la FC tarda en estabilizarse e infla el resultado; el de la sesión completa se muestra al lado. Solo se considera comparable si dura más de 30 min, el perfil de las dos mitades es parecido (diferencia de pendiente media < 2 %) y el índice de variabilidad (NP ÷ potencia media) no pasa de 1,10. En una subida seguida de bajada no significa nada.")),React.createElement(re,{title:"Ritmo ajustado por pendiente (GAP)",formula:`C(i) = 155,4·i⁵ − 30,4·i⁴ − 43,3·i³ + 46,3·i² + 19,5·i + 3,6     (J/kg/m, i = pendiente)

:"Dinámica de carrera",formula:"zancada media = distancia / pasos        pasos = Σ cadencia (pasos/min) / 60, segundo a segundo"},React.createElement("p",null,"Tiempo de contacto, oscilación y ratio vertical se promedian sobre los segundos en que el POD da dato (al andar no mide contacto ni balance). La cadencia se muestra de dos formas: en movimiento, sin contar los segundos sin pasos, y total, que es la que guarda el reloj. La zancada media es distancia entre pasos, como la del reloj; por terreno se promedia el valor instantáneo. El balance fuera de 40–60 % se descarta como lectura atípica: con ese filtro la media coincide con la del reloj.")),React.createElement(re,{title:"Por qué el desnivel tiene su propio modelo",refs:"Ehrström S, Tartaruga MP, Easthope CS, Brisswalter J, Morin JB, Vercruyssen F. Short trail running race: beyond the classic model for endurance running performance. Med Sci Sports Exerc. 2018;50(3):580-8."},React.createElement("p",null,"En un trail de 27 km con nueve corredores muy entrenados, el modelo clásico (VO₂máx, fracción sostenida y economía en llano) no predijo bien el rendimiento; al añadir la resistencia local de los extensores de rodilla y cambiar la economía en llano por la economía al +10 %, el ajuste mejoró mucho (R = 0,98). De ahí que la app vigile lo específico de la subida (VAM, carga de desnivel) junto al TSS. El estudio no propone el D+ como métrica de carga: usarlo así es una decisión de diseño de esta app."))),React.createElement("div",{className:"card"},React.createElement("h2",{className:"sec",style:{marginTop:0}},"Carga acumulada"),React.createElement(re,{title:"Forma física, fatiga y forma (PMC)",formula:"CTL hoy = CTL ayer + (carga hoy − CTL ayer) · (1 − e^(−1/"+e.load.ctlDays+`))

TSB hoy = CTL ayer − ATL ayer`,refs:"Banister EW, Calvert TW, Savage MV, Bach T. A systems model of training for athletic performance. Aust J Sports Med. 1975;7:57-61. Coggan AR. The Performance Manager. En: Allen y Coggan, op. cit."},React.createElement("p",null,"Modelo impulso-respuesta de Banister en la forma simplificada de Coggan. Se calcula dos veces: con el TSS diario y con los metros de desnivel positivo diarios. El TSS cuenta todo (también bici, fuerza y rocódromo); los kilómetros y el desnivel, solo lo hecho a pie (carrera y senderismo): subir en bici no carga las piernas como subir y bajar corriendo, y en esquí el desnivel lo pone el telesilla. Los km de bici se muestran aparte. En bici no se usa el FTP de carrera: con potenciómetro, la carga sale de la potencia con tu FTP de bici (el que pongas en Ajustes o, si no, el 95 % de tu mejor media de 20 min en bici del último año); sin potenciómetro, del pulso (hrTSS) con tu FC umbral en bici, o la de correr si la dejas vacía. Como en bici el pulso suele ir algo más bajo al mismo esfuerzo, con el umbral de correr la carga de la bici sale algo corta. CTL arranca en ",g(e.load.seedCtl,0),": con poco historial, los primeros valores quedan por debajo de tu forma real y el TSB sale demasiado negativo. Por eso la alerta de TSB no se activa hasta tener 6 semanas de datos, salvo que fijes un CTL inicial en Ajustes.")),React.createElement(re,{title:"Relación carga aguda : crónica (ACWR)",formula:`Media móvil:  ACWR = carga 7 días / (carga 28 días / 4)

IMC = peso (kg) / talla (m)²        ICC = cintura / cadera`,refs:"Epley B. Poundage chart. Boyd Epley Workout. Lincoln, NE; 1985."},React.createElement("p",null,"La fórmula de Epley es razonable hasta unas 10 repeticiones. El IMC no distingue músculo de grasa: en un deportista dicen más la cintura y el índice cintura-cadera.")),React.createElement(re,{title:"Cumplimiento del plan",formula:"Cumplimiento % = sesiones obligatorias hechas / sesiones obligatorias previstas · 100"},React.createElement("p",null,"Cada sesión prevista de carrera, senderismo, bici, fuerza o rocódromo se empareja con una hecha esa semana (una de senderismo solo con una salida andando; una salida andando también puede cumplir una de carrera): primero por tipo (calidad, rodaje, larga), después por familia de intensidad y al final con cualquiera de la categoría, eligiendo la de duración más parecida. Una sesión hecha es de calidad si acumula 6 min o más en Z4–Z5 (o IF ≥ 0,92), larga si pasa de 75 min, y rodaje en otro caso. Las opcionales no penalizan y puedes marcar cualquiera a mano.")),React.createElement(re,{title:"Recomendación semanal"},React.createElement("p",null,"Reglas fijas, de más a menos restrictivas: con ACWR por encima de ",g(e.alerts.acwr,1)," (en TSS o en desnivel), TSB por debajo de ",e.alerts.tsb," o VFC semanal bajo tu rango, propone descarga (60–80 % de la carga crónica). Con avisos menores (ACWR 1,3–1,5, desacoplamiento > ",e.alerts.decoupling," %, monotonía > ",e.alerts.monotony,") propone mantener. Con ACWR bajo y TSB positivo admite subir un 5–10 %. En el resto, progresión normal de hasta un 10 % y nunca por encima de 1,3 veces la carga crónica. Es una orientación a partir de tus datos, no sustituye a cómo te encuentras."))),React.createElement("div",{className:"card"},React.createElement("h2",{className:"sec",style:{marginTop:0}},"Récords, curva de potencia y rutas"),React.createElement(re,{title:"Mejores marcas por distancia y por duración"},React.createElement("p",null,"Dentro de cada sesión se busca el tramo más rápido de 1, 5, 10 km y siguientes sobre el tiempo en movimiento, la mejor potencia media de 5 s a 2 h y la mejor velocidad de ascenso de 5 a 60 min. Los récords son el mejor valor entre todas las sesiones. Los tiempos por distancia dependen de la distancia medida en cada sesión (corregida con el GPS cuando el sensor de pie falla) y, en montaña, del terreno.")),React.createElement(re,{title:"Potencia crítica",formula:"P(t) = CP + W′ / t          ajuste lineal de P frente a 1/t con los mejores esfuerzos de 3 a 20 min",refs:"Monod H, Scherrer J. The work capacity of a synergic muscular group. Ergonomics. 1965;8(3):329-38. Hill DW. The critical power concept: a review. Sports Med. 1993;16(4):237-54. Jones AM, Vanhatalo A, Burnley M, Morton RH, Poole DC. Critical power: implications for determination of V̇O₂max and exercise tolerance. Med Sci Sports Exerc. 2010;42(10):1876-90."},React.createElement("p",null,"CP es la potencia que podrías sostener mucho tiempo y W′ la reserva de trabajo por encima de ella. El ajuste solo es válido si los esfuerzos de la curva fueron máximos; con entrenamientos normales da un valor por debajo del real. Por eso se muestra como referencia y no se usa como FTP.")),React.createElement(re,{title:"Rutas repetidas y la misma subida"},React.createElement("p",null,"Dos sesiones son la misma ruta si la salida, los puntos al 25, 50 y 75 % de la distancia y la llegada quedan a menos de 350 m y la distancia difiere menos de un 8 %. Así se distingue el sentido y se evitan rutas distintas que salen del mismo sitio. La temperatura que se muestra es la media que mide el reloj en la muñeca, algo más alta que la del aire."))),React.createElement("div",{className:"card"},React.createElement("h2",{className:"sec",style:{marginTop:0}},"Simulador de rutas"),React.createElement(re,{title:"Tu velocidad en cada pendiente",formula:`Para cada pendiente g (casillas de 2 %):   v(g, FC) = c(g) · (FC − FC reposo)^k

Tiempo = Σ tramo / v(pendiente del tramo, FC del terreno)   (+ fatiga y paradas, si las pones)`,refs:"Sin datos a una pendiente se usa la velocidad en llano corregida por el coste energético de Minetti et al. (2002), con el mismo límite en bajada que el ritmo ajustado. El resto es un criterio de esta app, no un modelo publicado."},React.createElement("p",null,"De cada sesión se guarda una tabla con los segundos y los metros recorridos en cada combinación de pendiente (de −40 a +40 %) y pulso (franjas de 10 ppm). Con las tablas de las sesiones elegidas se ajusta, para cada pendiente, una sola constante que relaciona tu velocidad con tu pulso, y se evalúa en el pulso que piensas llevar. En llano y en bajada se usa tu diferencia habitual de pulso respecto a las subidas. En bajada el pulso casi no manda (exponente 0,35): lo que limita es la técnica y el terreno."),React.createElement("p",null,"Se ajusta una curva en vez de leer directamente la casilla porque el pulso va con retraso: en el llano que sigue a una subida sigue alto aunque ya vayas despacio, y eso falsearía la lectura."),React.createElement("p",null,"Una sesión muy larga no pesa más que 90 minutos al construir la curva: en una ultra vas más lento al mismo pulso (fatiga, terreno técnico, avituallamientos) y, sin ese tope, una sola carrera de ocho horas arrastraba hacia abajo la velocidad de todo lo demás. Solo se aprende de sesiones de carrera; el senderismo se deja fuera."),React.createElement("p",null,"Fiabilidad. La pantalla la mide con tus propios datos cada vez que la abres: predice cada sesión de más de 20 minutos usando solo las demás y el pulso que llevaste ese día, y compara con lo que tardaste. El margen del tiempo estimado es ese error medio (entre el 5 y el 20 %). ",$e.simReliability),React.createElement("p",null,"La estimación rápida sin perfil reparte el desnivel en subidas y bajadas de pendiente constante y deja el resto llano: sirve para orientarse, no para afinar. El ajuste de fatiga resta un
